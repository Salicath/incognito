# Controller track registry — tech-giant erasure targets.
# Hand-verified 2026-07-05 (research + adversarial verification pass; every email
# confirmed in a current official source or dropped). NOT loaded into the broker
# registry — see backend/core/controller.py and docs/tracks/controller.md.
# datenanfragen.de slugs kept as join keys; the base dataset was stale for 5 of
# these 16 records, so values here win.

controllers:
  - name: Meta (Facebook / Instagram / WhatsApp)
    domain: meta.com
    eu_entity: Meta Platforms Ireland Limited
    entity_country: IE
    lead_dpa: IE DPC
    contact_kind: form_only
    privacy_email: ""
    email_viable: false
    selfservice_url: https://accountscenter.facebook.com/personal_info/account_ownership_and_control
    erasure_form_url: https://help.meta.com/support/privacy/
    postal_address: "Meta Platforms Ireland Ltd, ATTN: Privacy Operations, Merrion Road, Dublin 4, D04 X2K5, Ireland"
    retention_note: >-
      30-day grace period, then up to 90 days to delete from active systems plus up
      to 90 more in backups. Off-Facebook activity, disassociated logs and content
      others posted about you survive account deletion.
    art17_value: >-
      Targets off-Facebook activity data, disassociated logs and residual copies
      that account deletion never touches.
    prerequisites:
      - Download your information first (Accounts Centre > Your information)
      - WhatsApp must be deleted separately, in-app (Settings > Account > Delete my account)
    form_instructions: >-
      Use the Meta privacy support hub and choose the option for exercising your
      GDPR rights / erasure. WhatsApp has its own DPO form at
      whatsapp.com/contact/forms/382532939919295.
    language: en
    last_verified: "2026-07-05"
    datenanfragen_slug: facebook
    notes: >-
      Do NOT use privacy@meta.com — third-party claim, never verified in an official
      source. WhatsApp EEA controller is WhatsApp Ireland Limited.

