name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,scanner]"

      - name: Lint
        run: ruff check .

      - name: Security scan
        run: bandit -r backend/ -c pyproject.toml -ll -q

      - name: Test
        run: pytest tests/ -v --tb=short

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: frontend
        run: npm run build

  broker-validation:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pydantic

      - name: Validate broker YAML files
        run: |
          python -c "
          from pathlib import Path
          import yaml
          import sys

          required_fields = ['name', 'domain', 'category', 'dpo_email', 'removal_method', 'country', 'gdpr_applies', 'verification_required', 'language', 'last_verified']
          valid_categories = ['data_broker', 'people_search', 'marketing', 'credit_agency', 'other']
          valid_methods = ['email', 'web_form', 'api']
          errors = []
          count = 0

          for path in sorted(Path('brokers').glob('*.yaml')):
              if path.stem in ('schema', 'cpr_levers', 'controllers', 'time_locked', 'restriction_only'):
                  continue
              count += 1
              try:
                  data = yaml.safe_load(path.read_text())
                  for field in required_fields:
                      if field not in data:
                          errors.append(f'{path.name}: missing field \"{field}\"')
                  if data.get('category') not in valid_categories:
                      errors.append(f'{path.name}: invalid category \"{data.get(\"category\")}\"')
                  if data.get('removal_method') not in valid_methods:
                      errors.append(f'{path.name}: invalid removal_method \"{data.get(\"removal_method\")}\"')
              except Exception as e:
                  errors.append(f'{path.name}: {e}')

          print(f'Validated {count} broker files')
          if errors:
              for e in errors:
                  print(f'ERROR: {e}')
              sys.exit(1)
          print('All broker files valid')
          "

      - name: Validate controller registry
        run: |
          python -c "
          from pathlib import Path
          import yaml
          import sys

          required = ['name', 'domain', 'eu_entity', 'entity_country', 'contact_kind', 'email_viable', 'selfservice_url', 'retention_note', 'art17_value', 'language', 'last_verified']
          valid_kinds = ['privacy_email', 'dpo_email', 'form_only']
          errors = []

          data = yaml.safe_load(Path('brokers/controllers.yaml').read_text())
          controllers = data.get('controllers', [])
          for c in controllers:
              label = c.get('name', '<unnamed>')
              for field in required:
                  if field not in c:
                      errors.append(f'{label}: missing field \"{field}\"')
              if c.get('contact_kind') not in valid_kinds:
                  errors.append(f'{label}: invalid contact_kind \"{c.get(\"contact_kind\")}\"')
              if c.get('email_viable') and not c.get('privacy_email'):
                  errors.append(f'{label}: email_viable without privacy_email')
              if not c.get('email_viable') and not c.get('erasure_form_url'):
                  errors.append(f'{label}: form-only without erasure_form_url')

          print(f'Validated {len(controllers)} controller records')
          if errors:
              for e in errors:
                  print(f'ERROR: {e}')
              sys.exit(1)
          print('All controller records valid')
          "

      - name: Docs claim the real registry counts
        run: |
          python -c "
          from pathlib import Path
          import re, sys, yaml

          brokers = 0
          for f in sorted(Path('brokers').glob('*.yaml')):
              if f.stem in ('schema','cpr_levers','controllers','time_locked','restriction_only'):
                  continue
              d = yaml.safe_load(f.read_text())
              if d and isinstance(d, dict) and 'name' in d:
                  brokers += 1
          controllers = len(yaml.safe_load(Path('brokers/controllers.yaml').read_text())['controllers'])

          errors = []
          for doc in ('README.md', 'CLAUDE.md'):
              text = Path(doc).read_text()
              for claimed in re.findall(r'(\d+) (?:data )?brokers', text):
                  if int(claimed) != brokers:
                      errors.append(f'{doc}: claims {claimed} brokers, registry has {brokers}')
              for claimed in re.findall(r'(\d+) controllers', text):
                  if int(claimed) != controllers:
                      errors.append(f'{doc}: claims {claimed} controllers, registry has {controllers}')

          print(f'Registry: {brokers} brokers, {controllers} controllers')
          if errors:
              for e in errors:
                  print(f'ERROR: {e}')
              sys.exit(1)
          print('Docs match the registries')
          "

      - name: Validate statutory registries
        run: |
          python -c "
          from pathlib import Path
          import yaml
          import sys

          errors = []

          tl = yaml.safe_load(Path('brokers/time_locked.yaml').read_text())
          tl_entries = tl.get('entries', [])
          for e in tl_entries:
              label = e.get('id', '<unnamed>')
              for field in ['id', 'name', 'holder_type', 'legal_basis', 'trigger_label', 'expiry', 'art17_note']:
                  if field not in e:
                      errors.append(f'time_locked/{label}: missing \"{field}\"')
              if not isinstance(e.get('expiry', {}).get('years'), int):
                  errors.append(f'time_locked/{label}: expiry.years must be an int')
              if e.get('basis_kind', 'retention_duty') not in ('retention_duty', 'limitation'):
                  errors.append(f'time_locked/{label}: invalid basis_kind')

          ro = yaml.safe_load(Path('brokers/restriction_only.yaml').read_text())
          ro_entries = ro.get('entries', [])
          for e in ro_entries:
              label = e.get('id', '<unnamed>')
              for field in ['id', 'name', 'what_it_is', 'why_undeletable', 'mitigation']:
                  if field not in e:
                      errors.append(f'restriction_only/{label}: missing \"{field}\"')

          if not tl_entries or not ro_entries:
              errors.append('statutory registries must not be empty')
          print(f'Validated {len(tl_entries)} time_locked + {len(ro_entries)} restriction_only records')
          if errors:
              for e in errors:
                  print(f'ERROR: {e}')
              sys.exit(1)
          print('All statutory records valid')
          "

  container:
    runs-on: ubuntu-latest
    needs: [test, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU for multi-arch
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build multi-arch (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Containerfile
          platforms: linux/amd64,linux/arm64
          push: false
          load: false

      - name: Build and smoke test (amd64)
        run: |
          docker build -f deploy/Containerfile -t incognito:test .
          docker run --rm -d --name incognito-test -p 8080:8080 incognito:test
          sleep 3
          curl -sf http://localhost:8080/api/health
          docker stop incognito-test

  publish:
    runs-on: ubuntu-latest
    needs: [test, frontend, container, broker-validation]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR requires a lowercase repository name; github.repository is "Salicath/..."
      - name: Compute lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Build and push multi-arch
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
